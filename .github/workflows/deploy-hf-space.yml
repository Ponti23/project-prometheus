# Creates/updates the Hugging Face Docker Space and smoke-tests the live app.
# Setup: repo secrets HF_TOKEN (Hugging Face write token) and NEBIUS_API_KEY.
# Optional repo variable HF_SPACE (default "<hf user>/project-prometheus").
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub httpx
      - name: Check the token is set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add the HF_TOKEN repo secret first (see docs/DEPLOY.md)"; exit 1; fi
      - name: Deploy
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python scripts/deploy_space.py
      - name: Smoke-test the live app (waits for the build)
        run: python scripts/smoke_test.py "${{ steps.deploy.outputs.url }}" --wait 900 --chat
      - run: echo "Live at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
