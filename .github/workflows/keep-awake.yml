# Free Render services sleep after 15 minutes without traffic. Visiting the static page
# every 10 minutes keeps the demo awake for judges (one service fits in Render's 750 free hours a month).
# The repo variable APP_URL overrides the default URL below. No model calls, no credits used.
name: Keep app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://project-prometheus-tp0i.onrender.com' }}
    steps:
      - run: curl -fsS -o /dev/null -w "%{http_code} $APP_URL\n" --retry 5 --retry-delay 20 --max-time 120 "$APP_URL/"
