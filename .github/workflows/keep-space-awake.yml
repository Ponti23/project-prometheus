# Free Spaces sleep after ~48 h without visitors. A daily visit keeps the demo awake through judging.
# It loads only the static page, so it costs no Token Factory credits.
name: Keep Space awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Visit the app
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          [ -z "$HF_TOKEN" ] && { echo "HF_TOKEN not set; nothing to ping"; exit 0; }
          URL=$(python - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          repo = os.environ.get("HF_SPACE") or HfApi(token=os.environ["HF_TOKEN"]).whoami()["name"] + "/project-prometheus"
          print("https://" + re.sub(r"[^a-z0-9]+", "-", repo.lower().replace("/", "-")).strip("-") + ".hf.space")
          PY
          )
          curl -fsS -o /dev/null -w "%{http_code} $URL\n" --retry 5 --retry-delay 30 "$URL/"
